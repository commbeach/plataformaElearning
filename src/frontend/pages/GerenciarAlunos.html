<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Alunos | E-Learning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/src/frontend/pages/components/styles.css">
</head>
<body>

    <div id="sidebar-placeholder"></div>

    <main class="main-content">
        <div class="container-fluid">
            <h2 class="mb-4 fw-bold">Gerenciar Alunos</h2>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body p-4">
                    <form id="formAluno" method="POST" action="/alunos" class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Nome Completo</label>
                            <input type="text" name="nomAluno" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">CPF</label>
                            <input type="text" name="cpfAluno" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">E-mail</label>
                            <input type="email" name="emailAluno" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Telefone</label>
                            <input type="text" name="telAluno" class="form-control">
                        </div>

                        <!-- SEÇÃO DE ENDEREÇO -->
                        <div class="col-md-3">
                            <label class="form-label">Tipo</label>
                            <select name="tipoLogradouro" class="form-select">
                                <option value="Rua">Rua</option>
                                <option value="Avenida">Avenida</option>
                                <option value="Praça">Praça</option>
                                <option value="Rodovia">Rodovia</option>
                                <option value="Ponte">Ponte</option>
                                <option value="Beco">Beco</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Logradouro (Nome da Rua)</label>
                            <input type="text" name="logradouro" class="form-control">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Número</label>
                            <input type="text" name="numero" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Complemento</label>
                            <input type="text" name="complemento" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Bairro</label>
                            <input type="text" name="bairro" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">CEP</label>
                            <input type="text" name="cep" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Cidade</label>
                            <input type="text" name="cidade" class="form-control">
                        </div>
                        <div class="col-md-1">
                            <label class="form-label">UF</label>
                            <input type="text" name="estado" class="form-control" maxlength="2">
                        </div>

                        <div class="col-md-12 d-flex justify-content-end mt-4">
                            <button type="submit" id="btnSalvar" class="btn btn-primary px-5 py-2">Salvar Aluno</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table id="tabela" class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Nome</th>
                                    <th>CPF</th>
                                    <th>E-mail</th>
                                    <th>Endereço Completo</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('/src/frontend/pages/components/sidebar.html')
            .then(res => res.text())
            .then(data => { document.getElementById('sidebar-placeholder').innerHTML = data; })
            .catch(err => console.error(err));
    </script>

    <div class="modal fade" id="modalCursos" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="modalCursosLabel">Cursos do Aluno</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="list-group" id="listaCursosModal">
                        </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/src/frontend/scripts/GerenciarAlunos/crudAluno.js"></script>
</body>
</html>
