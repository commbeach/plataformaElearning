<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>Plataforma E-Learning</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <script src="carregarAluno.js"></script>
    <h1>Gerenciar Alunos</h1>


<!-- Formulário de cadastro aluno---->
<div>
    <form method="post" actions="/">
        <input type="hidden" name="idAluno">
        <input type="text" name="nomAluno" placeholder="Nome do Aluno">
        <input type="text" name="cpfAluno" placeholder="CPF do Aluno">
        <input type="text" name="emailAluno" placeholder="E-mail do Aluno">
        <input type="text" name="telAluno" placeholder="Telefone do Aluno">
        <input type="text" name="cidadeAluno" placeholder="Cidade">
        <input type="text" name="estadoAluno" placeholder="Estado">
        <button>Salvar</button>
</form>
</div>

<table id="tabela">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>CPF</th>
            <th>E-mail</th>
            <th>Telefone</th>
            <th>Cidade</th>
            <th>Estado</th>
        </tr>
    </thead>
    <tbody></tbody>

</table>

</body>
</html>
